name: Deploy to Production

# Ensure only one run per workflow+branch; cancel older runs when a new one starts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: src

      - name: Install Ruby dependencies
        working-directory: src
        run: bundle install

      - name: Cache setup
        uses: actions/cache@v6
        with:
          path: |
            src/vendor/bundle
            ~/.dotnet
          key: ${{ runner.os }}-build-${{ hashFiles('src/Gemfile.lock') }}

  generate:
    name: Generate Data Files
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: YAML Schema Validation
        run: dotnet tools/validate_yaml_schema.cs

      - name: Catalog Validation
        run: dotnet tools/validate_catalog.cs

      - name: Run data generators
        shell: pwsh
        run: |
          ./tools/build.ps1 --IncludeUpdates

      - name: Upload generated data
        uses: actions/upload-artifact@v7
        with:
          name: generated-data
          path: |
            src/_data/**
            src/extensions/**
            src/categories/**
            src/files/**
          retention-days: 7

  build:
    name: Build Jekyll Site
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: src

      - name: Install Ruby dependencies
        working-directory: src
        run: bundle install

      - name: Download generated data
        uses: actions/download-artifact@v8
        with:
          name: generated-data
          path: src/

      - name: Build Jekyll site
        working-directory: src
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: src/_site/
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    env:
      SSHPASS: ${{ secrets.STRATO_SSH_PASS }}
      SSH_TARGET: ${{ vars.STRATO_SSH_USER }}@${{ vars.STRATO_SSH_HOST }}
      REMOTE_WEBROOT: ${{ vars.REMOTE_WEBROOT }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-build
          path: _site/

      - name: Prepare SSH
        run: |
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.STRATO_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload web root
        run: |
          test -n "$REMOTE_WEBROOT"
          sshpass -e rsync -az --delete --checksum _site/ "$SSH_TARGET:$REMOTE_WEBROOT/"

      - name: Smoke test
        run: |
          sleep 5
          curl -fsS -o /dev/null "${{ vars.WEB_SERVER }}/"
          curl -fsS -o /dev/null "${{ vars.WEB_SERVER }}/search.json"
